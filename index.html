<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sant'Ana TV</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="player">

        <!-- MÍDIA -->
        <div id="midia-container">

            <img id="imagem-slide" src="" alt="" hidden>

            <video id="video-slide"
                   muted
                   autoplay
                   playsinline
                   hidden>
            </video>

        </div>

        <!-- LOGO -->
        <div class="logo-box">
            <img src="assets/logo/Logo1.jpg" alt="Padaria Sant'Ana">
        </div>

        <!-- LAYOUT PRODUTO -->
        <div id="layout-produto" class="layout">

            <div class="produto-info">

                <h1 id="produto-titulo"></h1>

                <p id="produto-descricao"></p>

            </div>

        </div>

        <!-- LAYOUT PROMOÇÃO -->
        <div id="layout-promocao" class="layout">

            <div class="promo-card">

                <div class="promo-tag">
                    PROMOÇÃO EM DESTAQUE
                </div>

                <h1 id="promo-titulo"></h1>

                <div id="promo-preco" class="promo-preco">
                </div>

                <p id="promo-descricao"></p>

            </div>

        </div>

        <!-- LAYOUT INFORMATIVO -->
        <div id="layout-info" class="layout">

            <div class="info-container">

                <div class="categoria">
                    <span id="info-categoria"></span>
                </div>

                <div class="info-box">

                    <h1 id="info-titulo"></h1>

                    <p id="info-descricao"></p>

                </div>

            </div>

        </div>

        <!-- LAYOUT INSTITUCIONAL -->
        <div id="layout-inst" class="layout">

            <div class="info-container">

                <div class="categoria">
                    <span id="inst-categoria"></span>
                </div>

                <div class="info-box">

                    <h1 id="inst-titulo"></h1>

                    <p id="inst-descricao"></p>

                </div>

            </div>

        </div>

        <!-- RODAPÉ -->
        <div id="rodape">

            <div id="hora">
                00:00
            </div>

            <div class="ticker">

                <div class="ticker-text">

                    WhatsApp (35) XXXX-XXXX •
                    Encomendas de bolos •
                    Pães fresquinhos todos os dias •
                    Café especial •
                    Padaria Sant'Ana •

                </div>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
