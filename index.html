<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Padaria Sant'Ana</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topo">
    <div class="empresa">
        <img src="img/Logo1.jpg" class="logo">
        <span>PADARIA SANT'ANA</span>
    </div>

    <div id="relogio"></div>
</div>

<div class="slide">

    <div id="slideImagem" class="slide-conteudo">
        <img id="imagem" src="">
        <div class="texto">
            <h2 id="titulo"></h2>
            <p id="descricao"></p>
        </div>
    </div>

    <div id="slideCafe" class="painel-cafe">
        <h1>☕ Mercado do Café</h1>
        <h2>NY Arabica Coffee C</h2>

        <div class="preco-cafe alta">
            ▲ 272,35 US¢/lb
        </div>

        <div class="variacao-cafe alta">
            +1,25%
        </div>

        <p class="fonte">Atualizado: 24/05/2026</p>
    </div>

</div>

<div class="rodape">
    WhatsApp: (35) XXXX-XXXX • Encomendas de bolos • Pães fresquinhos todos os dias
</div>

<script src="script.js"></script>

</body>
</html>
