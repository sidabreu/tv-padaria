<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sant'Ana TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="player">

        <!-- MÍDIA -->
        <div id="midia-container">

            <img id="imagem-slide" src="" alt="" hidden>

            <video id="video-slide"
                   muted
                   autoplay
                   playsinline
                   hidden>
            </video>

        </div>

       

        <!-- LAYOUT PRODUTO -->
        <div id="layout-produto" class="layout">

            <div class="produto-info">

                <h1 id="produto-titulo"></h1>

                <p id="produto-descricao"></p>

            </div>

        </div>

        <!-- LAYOUT PROMOÇÃO -->
        <div id="layout-promocao" class="layout">

            <div class="promo-card">

                <div class="promo-tag">
                    PROMOÇÃO EM DESTAQUE
                </div>

                <h1 id="promo-titulo"></h1>

                <div id="promo-preco" class="promo-preco">
                </div>

                <p id="promo-descricao"></p>

            </div>

        </div>

        <!-- LAYOUT INFORMATIVO -->
        <div id="layout-info" class="layout">

            <div class="info-container">

                <div class="categoria">
                    <span id="info-categoria"></span>
                </div>

                <div class="info-box">

                    <h1 id="info-titulo"></h1>

                    <p id="info-descricao"></p>

                </div>

            </div>

        </div>

        <!-- LAYOUT INSTITUCIONAL -->
        <div id="layout-inst" class="layout">

            <div class="info-container">

                <div class="categoria">
                    <span id="inst-categoria"></span>
                </div>

                <div class="info-box">

                    <h1 id="inst-titulo"></h1>

                    <p id="inst-descricao"></p>

                </div>

            </div>

        </div>

       
    </div>

    <script src="js/app.js"></script>

</body>

</html>
