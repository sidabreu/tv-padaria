<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TV Padaria Sant'Ana</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<style>
#telaInicio {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999999;
}

#btnIniciarPainel {
  font-family: Montserrat, sans-serif;
  font-size: 32px;
  font-weight: 800;
  padding: 25px 60px;
  border: 0;
  border-radius: 15px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- RÁDIO ONLINE INVISÍVEL -->
<audio id="radioInternet" preload="none"></audio>

<!-- TELA INICIAL -->
<div id="telaInicio">
  <button id="btnIniciarPainel">▶ INICIAR PAINEL</button>
</div>

<main id="player">

  <div id="midia-container">
    <img id="imagem-slide" alt="">
    <video id="video-slide" muted playsinline></video>
  </div>

  <section id="layout-abertura" class="layout layout-centro">
    <div class="abertura-box texto-animado">
      <div id="abertura-categoria" class="tag-dourada"></div>
      <h1 id="abertura-titulo"></h1>
      <p id="abertura-descricao"></p>
    </div>
  </section>

  <section id="layout-produto" class="layout">
    <div class="produto-info texto-animado">
      <h1 id="produto-titulo"></h1>
      <p id="produto-descricao"></p>
    </div>
  </section>

  <section id="layout-combo" class="layout">
    <div class="combo-card texto-animado">
      <div id="combo-tag" class="combo-tag">COMBO ESPECIAL</div>
      <h1 id="combo-titulo"></h1>
      <div id="combo-preco" class="combo-preco"></div>
      <p id="combo-descricao"></p>
    </div>
  </section>

  <section id="layout-institucional" class="layout">
    <div class="institucional-box texto-animado">
      <div id="inst-categoria" class="tag-vermelha"></div>
      <h1 id="inst-titulo"></h1>
      <p id="inst-descricao"></p>
    </div>
  </section>

  <section id="layout-clima" class="layout layout-centro">
    <div class="painel clima-card texto-animado">

     
      <div class="noticias-hora" id="hora-noticias">
        --:--
      </div>
    

      <h1>🌤️ CLIMA</h1>

      <h2 id="clima-cidade">
        Campos Gerais - MG
      </h2>

      <div class="clima-agora">
        <span>AGORA</span>

        <strong id="clima-agora">
          --°C
        </strong>

        <p id="clima-descricao">
          Atualizando...
        </p>
      </div>

      <div class="info-dupla clima-dupla">

        <div>
          <span id="icone-hoje">
            🌤️ Hoje
          </span>

          <strong id="clima-hoje">
            --° / --°
          </strong>
        </div>

        <div>
          <span id="icone-amanha">
            🌤️ Amanhã
          </span>

          <strong id="clima-amanha">
            --° / --°
          </strong>
        </div>

      </div>

      <p id="frase-clima" class="fonte">
        Seja bem-vindo à Padaria Sant'Ana.
      </p>

    </div>
  </section>

  <section id="layout-noticias" class="layout layout-centro">
    <div class="painel noticias-card texto-animado">

      <div class="tag-dourada">
        📰 DESTAQUE SUL DE MINAS
      </div>

      <h1 id="noticia-titulo">
        Carregando notícia...
      </h1>

      <p id="noticia-descricao">
        Aguarde...
      </p>

      <div class="noticias-hora" id="hora-noticias">
        --:--
      </div>

      <p class="fonte">
        Fonte: G1 Sul de Minas
      </p>

    </div>
  </section>

</main>

<script src="script.js"></script>

<script>
const radioInternet = document.getElementById("radioInternet");
const telaInicio = document.getElementById("telaInicio");
const btnIniciarPainel = document.getElementById("btnIniciarPainel");

radioInternet.src = "https://live.brasilhits.com/listen/brasilhits-sertanejo/acc";
radioInternet.volume = 0.25;

btnIniciarPainel.addEventListener("click", async function () {
  try {
    await radioInternet.play();
    console.log("Rádio tocando.");
  } catch (erro) {
    console.error("Erro ao iniciar rádio:", erro);
  }

  telaInicio.style.display = "none";

  try {
    await document.documentElement.requestFullscreen();
  } catch (erro) {
    console.log("Tela cheia não disponível:", erro);
  }
});

radioInternet.addEventListener("error", function () {
  console.log("Rádio desconectada. Tentando reconectar...");
  setTimeout(function () {
    radioInternet.load();
    radioInternet.play().catch(function () {});
  }, 5000);
});
</script>

</body>
</html>
